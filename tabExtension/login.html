<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabFlow - Login & Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="standalone-auth-body">
    <div class="standalone-auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="brand-logo-large" style="display:flex; align-items:center; justify-content:center; gap:8px;">
                    <svg width="36" height="28" viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="14" y="10" width="62" height="20" rx="8" transform="rotate(-6 45 20)" fill="#1D4ED8" />
                        <rect x="22" y="28" width="62" height="20" rx="8" transform="rotate(-3 53 38)" fill="#3B82F6" />
                        <rect x="30" y="46" width="62" height="20" rx="8" transform="rotate(-1 61 56)" fill="#10B981" />
                    </svg>
                    <span>TabFlow</span>
                </div>
                <p id="authSubtitle" style="font-size: 13px; color: var(--text-secondary); margin-top: 4px;">Save tabs, suspend memory leaks, and sync workspaces</p>
            </div>

            <div style="margin-bottom: 16px;">
                <button type="button" onclick="window.open('https://tabflow-dashboard-eight.vercel.app/login', '_blank')" style="width: 100%; background: #ffffff; color: #1f2937; border: 1px solid #e5e7eb; border-radius: 9999px; padding: 10px 16px; font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    Continue with Google
                </button>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab-btn active" id="loginTabBtn">Login</button>
                <button class="auth-tab-btn" id="registerTabBtn">Register</button>
            </div>

            <form id="standaloneAuthForm" onsubmit="return false;">
                <div class="form-group">
                    <label for="emailInput">Email Address</label>
                    <input type="email" id="emailInput" placeholder="name@example.com" required />
                </div>

                <div class="form-group">
                    <label for="passwordInput">Password</label>
                    <input type="password" id="passwordInput" placeholder="••••••••" required />
                </div>

                <div class="auth-error-msg" id="authError" style="display:none;"></div>

                <div class="form-actions">
                    <button type="button" class="btn-auth-submit" id="loginBtn">Log In</button>
                    <button type="button" class="btn-auth-submit" id="registerBtn" style="display:none; background: var(--accent-green);">Create Account</button>
                </div>
            </form>

            <div class="auth-footer">
                <button type="button" class="skip-link" id="continueOfflineBtn">Continue in Offline Mode &rarr;</button>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="auth.js"></script>
    <script>
        let currentMode = 'login';
        const loginTab = document.getElementById('loginTabBtn');
        const registerTab = document.getElementById('registerTabBtn');
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const authError = document.getElementById('authError');

        loginTab.addEventListener('click', () => setMode('login'));
        registerTab.addEventListener('click', () => setMode('register'));

        function setMode(mode) {
            currentMode = mode;
            authError.style.display = 'none';
            if (mode === 'login') {
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                loginBtn.style.display = 'block';
                registerBtn.style.display = 'none';
            } else {
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
                registerBtn.style.display = 'block';
                loginBtn.style.display = 'none';
            }
        }

        async function submitAuth() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            
            authError.style.display = 'none';
            const res = await Auth.handleAuth(currentMode, email, password);

            if (res.error) {
                authError.textContent = res.error;
                authError.style.display = 'block';
            } else {
                window.location.href = 'popup.html';
            }
        }

        loginBtn.addEventListener('click', submitAuth);
        registerBtn.addEventListener('click', submitAuth);
        document.getElementById('continueOfflineBtn').addEventListener('click', () => {
            window.location.href = 'popup.html';
        });
    </script>
</body>
</html>
